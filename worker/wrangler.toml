name = "bluecrane-forms"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "6d854ebfb0883774576779a01692019a"

routes = [
  { pattern = "forms.bluecrane.pro/*", zone_id = "88ec807b65a3e25e24c1db1f40438f68" }
]

# Rate limiting: 5 requests per 60 seconds per key
[[unsafe.bindings]]
name = "FORM_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# KV namespace for submission storage
[[kv_namespaces]]
binding = "FORM_SUBMISSIONS"
id = "5f39cb8025ca41af92131a8cbe1a7e6c"
